<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fretboard">
<meta name="theme-color" content="#14100d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Fretboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a practice tool, quiet and exact
IDEA: a real rosewood neck under your hand
PICTURE: the full 22-fret neck, notes as colored dots
COLOUR and TYPE: rosewood board, pearl inlays, four note inks; Archivo
LAYOUT: neck pinned on top, controls scroll beneath */
:root{color-scheme:light dark;--bg:light-dark(#faf8f4,#14100d);--ink:light-dark(#1d1712,#efe8de);--mute:light-dark(#6b6158,#a99e92);--line:light-dark(#e2dbd0,#2e2620);--chip:light-dark(#fff,#1f1914)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
.pad{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:8px}
h1{font-size:20px;margin:0 auto 0 0;font-weight:700;letter-spacing:-.01em}
button,select{font:inherit;font-size:15px;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer}
button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,select:focus-visible{outline:2px solid #5DCAA5;outline-offset:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0}
.neck{position:sticky;top:0;z-index:2;background:var(--bg);padding-top:6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
#fb{display:block;width:100%;min-width:760px;height:auto;color:var(--ink)}
.hint{display:none;font-size:13px;color:var(--mute);margin:4px 0 0}
@media (orientation:portrait){.hint{display:block}}
section{padding-top:14px;padding-bottom:4px}
h2{font-size:13px;font-weight:500;color:var(--mute);margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grp{display:flex;align-items:center;gap:10px;text-align:left;padding:6px 14px}
.grp[aria-pressed=true]{background:var(--chip);color:var(--ink);border-color:var(--ink)}
.grp[aria-pressed=false]{opacity:.45}
.grp small{display:block;font-size:13px;color:var(--mute);line-height:1.3}
.dot{width:16px;height:16px;border-radius:50%;flex:none}
.chips button{min-width:52px;padding:0 10px}
.meta{font-size:14px;color:var(--mute);margin:6px 0 0}
footer{font-size:13px;color:var(--mute);padding-top:18px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
</style></head><body>
<header class="pad"><h1>Fretboard</h1>
<div class="seg" role="group" aria-label="Mode"><button id="m-song">Songs</button><button id="m-scale">Scales</button></div></header>
<div class="neck pad"><div class="scroll"><svg id="fb" role="img" aria-label="Guitar neck with the selected notes"></svg></div><p class="hint">Turn your phone sideways to see the whole neck.</p></div>
<main id="ctl"></main>
<footer class="pad">High E on top, low E on the bottom, like tab. Ringed dots are the root.</footer>
<script>
{
const N=['C','C#','D','Eb','E','F','F#','G','G#','A','Bb','B'];
const FL=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const INT=['1','b2','2','b3','3','4','b5','5','b6','6','b7','7'];
const pc=s=>s.split(' ').map(n=>N.indexOf(n));
const INK={teal:['#5DCAA5','#04342C'],purple:['#AFA9EC','#26215C'],coral:['#F0997B','#4A1B0C'],amber:['#F2B552','#412402'],pink:['#ED93B1','#4B1528'],blue:['#85B7EB','#042C53']};

/* To add a song, copy this block and change the details. */
const SONGS=[
 {id:'little-wing',title:'Little Wing',artist:'Jimi Hendrix',key:'E minor',root:4,tuning:'Half step down (Eb standard)',offset:-1,
  groups:[
   {name:'E minor pentatonic',why:'Core lead notes',notes:pc('E G A B D'),ink:'teal'},
   {name:'Natural minor',why:'F# from Bm and D, C from Am and C',notes:pc('F# C'),ink:'purple'},
   {name:'Blue note (Bb)',why:'The b5, and the Bb chord',notes:pc('Bb'),ink:'coral'},
   {name:'Chromatic (F)',why:'Root of the borrowed F chord',notes:pc('F'),ink:'amber'}],
  chords:{Em:'E G B',G:'G B D',Am:'A C E',Bm:'B D F#',Bb:'Bb D F',C:'C E G',F:'F A C',D:'D F# A'},
  prog:['Em','G','Am','Em','Bm','Bb','Am','C','G','F','C','D']}
];
const SCALES=[['Minor pentatonic','0 3 5 7 10'],['Major pentatonic','0 2 4 7 9'],['Blues','0 3 5 6 7 10'],['Natural minor','0 2 3 5 7 8 10'],['Major','0 2 4 5 7 9 11'],['Dorian','0 2 3 5 7 9 10'],['Mixolydian','0 2 4 5 7 9 10'],['Harmonic minor','0 2 3 5 7 8 11']]
 .map(([name,s])=>({name,iv:s.split(' ').map(Number)}));

const OPEN=[4,11,7,2,9,4],FR=22,MARK=[3,5,7,9,12,15,17,19,21];
let st={mode:'song',song:'little-wing',off:[],chord:null,labels:'notes',actual:false,root:4,scale:0};
try{Object.assign(st,JSON.parse(localStorage.getItem('fretboard')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('fretboard',JSON.stringify(st))}catch(e){}};
const svg=document.getElementById('fb'),ctl=document.getElementById('ctl');
const fx=[50];for(let n=1;n<=FR;n++)fx[n]=fx[n-1]+50*0.975**(n-1);
const W=Math.ceil(fx[FR]+14),H=214,SY=[0,1,2,3,4,5].map(i=>28+i*28);
svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
const mid=f=>f===0?24:(fx[f-1]+fx[f])/2;
const song=()=>SONGS.find(s=>s.id===st.song)||SONGS[0];

function model(){
 if(st.mode==='song'){
  const s=song(),ch=st.chord&&s.chords[st.chord]?pc(s.chords[st.chord]):null;
  return {root:s.root,offset:st.actual?s.offset:0,
   style:p=>{const g=s.groups.find((g,i)=>!st.off.includes(i)&&g.notes.includes(p));return g?INK[g.ink]:null},
   dim:p=>!!ch&&!ch.includes(p)};
 }
 const sc=SCALES[st.scale]||SCALES[0];
 return {root:st.root,offset:0,style:p=>sc.iv.includes((p-st.root+12)%12)?(p===st.root?INK.coral:INK.teal):null,dim:()=>false};
}

function draw(){
 const m=model(),pearl='fill="#e9dfca" opacity=".5"';let o='';
 o+=`<rect x="${fx[0]}" y="12" width="${fx[FR]-fx[0]+8}" height="172" rx="3" fill="#3b2619"/>`;
 [3,5,7,9,15,17,19,21].forEach(f=>o+=`<circle cx="${mid(f)}" cy="98" r="6" ${pearl}/>`);
 o+=`<circle cx="${mid(12)}" cy="70" r="6" ${pearl}/><circle cx="${mid(12)}" cy="126" r="6" ${pearl}/>`;
 for(let f=1;f<=FR;f++)o+=`<line x1="${fx[f]}" x2="${fx[f]}" y1="12" y2="184" stroke="#b9b2a4" stroke-width="2"/>`;
 o+=`<rect x="${fx[0]-5}" y="10" width="7" height="176" rx="1" fill="#ece5d6"/>`;
 SY.forEach((y,i)=>o+=`<line x1="${fx[0]}" x2="${fx[FR]+8}" y1="${y}" y2="${y}" stroke="#d8d0c0" stroke-width="${(0.8+i*0.35).toFixed(2)}"/>`);
 for(let f=0;f<=FR;f++){const mk=MARK.includes(f);o+=`<text x="${mid(f)}" y="204" text-anchor="middle" font-size="12" font-weight="${mk?700:400}" fill="currentColor" opacity="${mk?1:.55}">${f}</text>`;}
 for(let s=0;s<6;s++)for(let f=0;f<=FR;f++){
  const p=(OPEN[s]+f)%12,c=m.style(p);if(!c)continue;
  const x=mid(f),y=SY[s],r=p===m.root;
  const lab=st.labels==='int'?INT[(p-m.root+12)%12]:(m.offset?FL[(p+m.offset+12)%12]:N[p]);
  o+=`<g opacity="${m.dim(p)?.14:1}"><circle cx="${x.toFixed(1)}" cy="${y}" r="11" fill="${c[0]}"${r?' stroke="#fff" stroke-width="2.5"':''}/><text x="${x.toFixed(1)}" y="${y}" dy=".36em" text-anchor="middle" font-size="11.5" font-weight="${r?700:500}" fill="${c[1]}">${lab}</text></g>`;
 }
 svg.innerHTML=o;
}

function ui(){
 document.getElementById('m-song').setAttribute('aria-pressed',st.mode==='song');
 document.getElementById('m-scale').setAttribute('aria-pressed',st.mode==='scale');
 let h='';
 if(st.mode==='song'){
  const s=song();
  h+=`<section class="pad"><div class="row"><select id="songSel" aria-label="Song">${SONGS.map(x=>`<option value="${x.id}"${x.id===s.id?' selected':''}>${x.title}, ${x.artist}</option>`).join('')}</select></div><p class="meta">Key: ${s.key} · Tuning: ${s.tuning}</p></section>`;
  h+=`<section class="pad"><h2>Note groups</h2><div class="row">${s.groups.map((g,i)=>`<button class="grp" data-g="${i}" aria-pressed="${!st.off.includes(i)}"><span class="dot" style="background:${INK[g.ink][0]}"></span><span>${g.name}<small>${g.why}</small></span></button>`).join('')}</div></section>`;
  h+=`<section class="pad"><h2>Progression: tap a chord to light up its notes</h2><div class="row chips">${s.prog.map(c=>`<button data-c="${c}" aria-pressed="${st.chord===c}">${c}</button>`).join('')}</div></section>`;
 }else{
  const sc=SCALES[st.scale]||SCALES[0];
  h+=`<section class="pad"><div class="row"><select id="rootSel" aria-label="Root note">${N.map((n,i)=>`<option value="${i}"${i==st.root?' selected':''}>${n}</option>`).join('')}</select><select id="scSel" aria-label="Scale">${SCALES.map((x,i)=>`<option value="${i}"${i==st.scale?' selected':''}>${x.name}</option>`).join('')}</select></div><p class="meta">Notes: ${sc.iv.map(v=>N[(st.root+v)%12]).join(' ')} · Intervals: ${sc.iv.map(v=>INT[v]).join(' ')}</p></section>`;
 }
 const tuned=st.mode==='song'&&song().offset;
 h+=`<section class="pad"><h2>Labels</h2><div class="row"><div class="seg"><button data-l="notes" aria-pressed="${st.labels==='notes'}">Note names</button><button data-l="int" aria-pressed="${st.labels==='int'}">Intervals</button></div>${tuned?`<button id="act" aria-pressed="${st.actual}">Actual pitch</button>`:''}</div>${tuned?`<p class="meta">Off: names match the shapes you finger. On: names match how the recording sounds.</p>`:''}</section>`;
 ctl.innerHTML=h;draw();save();
}

ctl.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.g!==undefined){const i=+b.dataset.g;st.off=st.off.includes(i)?st.off.filter(x=>x!==i):[...st.off,i];}
 else if(b.dataset.c){st.chord=st.chord===b.dataset.c?null:b.dataset.c;}
 else if(b.dataset.l){st.labels=b.dataset.l;}
 else if(b.id==='act'){st.actual=!st.actual;}
 ui();
});
ctl.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='songSel'){st.song=t.value;st.off=[];st.chord=null;}
 if(t.id==='rootSel')st.root=+t.value;
 if(t.id==='scSel')st.scale=+t.value;
 ui();
});
document.getElementById('m-song').addEventListener('click',()=>{st.mode='song';ui();});
document.getElementById('m-scale').addEventListener('click',()=>{st.mode='scale';ui();});
ui();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{});}
}
</script>
</body></html>
